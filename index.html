// ------------------ Export / Import ------------------
function download(name, content, type){
  const blob = new Blob([content],{type:type});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href=url; a.download=name; a.click();
  URL.revokeObjectURL(url);
}
function exportCSV(){
  const hmap = holidayMap();
  const all=[]; const dt = new Date(state.year,0,1);
  while(dt.getFullYear()===state.year){ all.push(keyOf(dt.getFullYear(),dt.getMonth(),dt.getDate())); dt.setDate(dt.getDate()+1); }
  const head = ["Facultativo","% Jornada"].concat(all.map(fmtDate));
  const rows = state.physicians.map(p=>[p.name, p.pct+"%"].concat(all.map(k=>{
    const a = state.assignments[p.id+"|"+k];
    if(!a){
      const dow = new Date(k).getDay();
      if((p.blocked||[]).includes(dow)) return "BLOQ";
      return hmap[k]?"F":"";
    }
    if(a.f) return a.f;
    return [a.m,a.t].filter(Boolean).join("+");
  })));
  const csv = [head].concat(rows).map(r=>r.join(";")).join("\n");
  download("cuadrante_"+state.year+".csv", "\uFEFF"+csv, "text/csv;charset=utf-8");
}
function exportBackup(){
  download("cuadrante_copia_"+new Date().toISOString().slice(0,10)+".json", JSON.stringify(state,null,1), "application/json");
}
function importBackup(file){
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const d = JSON.parse(r.result);
      if(!d || typeof d!=="object" || !("assignments" in d) || !("physicians" in d)) throw 0;
      state.physicians = (d.physicians||[]).map(p=>{const q=Object.assign({blocked:[]},p); if(q.noUrgf===undefined) q.noUrgf=!!q.noUrg; return q;});
      state.assignments = d.assignments||{};
      state.baseline = d.baseline||{};
      state.official = d.official||{};
      state.rotantes = d.rotantes||{};
      if(d.adminPass) state.adminPass = d.adminPass;
      state.rotantesLeyenda = Object.assign({R1:"",R2:"",R3:"",R4:"",R5:""}, d.rotantesLeyenda||{});
      state.holidays = d.holidays||DEFAULT_HOLIDAYS.slice();
      state.settings = Object.assign(DEFAULT_SETTINGS(), d.settings||{});
      if(!d.settings || (d.settings.v||0) < 3){
        state.settings.required = Object.assign({}, DEFAULT_REQUIRED);
        if(state.settings.minMorning===undefined || state.settings.minMorning<8) state.settings.minMorning = 8;
        if(state.settings.alruPerWeek===undefined) state.settings.alruPerWeek = 2;
        if(state.settings.alinterDaily===undefined) state.settings.alinterDaily = true;
        if(state.settings.strictQuota===undefined) state.settings.strictQuota = true;
        if(!state.settings.strictQuotaMigrated){ state.settings.strictQuota = true; state.settings.strictQuotaMigrated = true; }
        if(state.settings.ortMonthly===undefined) state.settings.ortMonthly = 1;
        if(state.settings.computeFrom===undefined) state.settings.computeFrom = 0;
        if(state.settings.maxMorning===undefined) state.settings.maxMorning = 8;
        state.settings.v = 3;
      }
      else{ state.settings.required = Object.assign({}, DEFAULT_REQUIRED, d.settings.required||{}); }
      state.year = d.year||2026;
      save(); render();
      alert("Copia restaurada correctamente.");
    }catch(e){ alert("El archivo no es una copia de seguridad válida."); }
  };
  r.readAsText(file);
}

// ------------------ Generación automática ------------------
// Saldo anual acumulado de un facultativo en los meses ANTERIORES a `beforeMonth` del año en curso.
// saldo = (jornadas trabajadas) - (objetivo de esos meses). Positivo = trabajó de más.
function monthHasSchedule(mo){
  const mk = state.year+"-"+pad(mo+1);
  if(state.baseline && state.baseline[mk] && Object.keys(state.baseline[mk]).length) return true;
  const pre = mk+"-";
  for(const k in state.assignments){ if(k.slice(k.indexOf("|")+1).indexOf(pre)===0) return true; }
  return false;
}
function carryBalance(p, beforeMonth, fromMonth){
  const hmap = Object.fromEntries(state.holidays.map(h=>[h.date,1]));
  const start = fromMonth||0;
  let done=0, due=0;
  for(let mo=start; mo<beforeMonth; mo++){
    if(!monthHasSchedule(mo)) continue;
    const dim = new Date(state.year, mo+1, 0).getDate();
    let lab=0;
    for(let day=1; day<=dim; day++){
      const dt=new Date(state.year, mo, day); const dow=dt.getDay();
      if(dow===0||dow===6) continue;
      const key=keyOf(state.year, mo, day);
      if(hmap[key]) continue;
      const a=officialAt(p.id, key);   // cómputo OFICIAL (ignora cambios entre compañeros)
      // Vacaciones, baja, permiso o libranza: ese día no se debe trabajar, así que
      // no cuenta como jornada exigible (si no, el saldo quedaría negativo sin motivo).
      if(a && a.f && ABSENCES[a.f]) continue;
      lab++;
      if(a) done += turnosOf(a);   // URG=2, URGF=0
    }
    due += lab * (p.pct||100)/100;  // objetivo del mes (laborables menos ausencias)
  }
  return done - due;   // + = de más ; - = de menos
}

function generateMonth(mode){
  const strictMode = state.settings.strictQuota===true;
  const allDays = monthDays();
  const hset = new Set(state.holidays.map(h=>h.date));
  const pool = poolCodes();
  const reqT = reqAfternoon();
  const minM = Math.min(state.settings.minMorning||7, pool.length);
  const urgReq = state.settings.urgRequired!==false;
  const alruTarget = (state.settings.alruPerWeek!==undefined ? state.settings.alruPerWeek : 2);
  let cleared=0, assigned=0; const unfilled=[];
  const labDays = allDays.filter(d=> d.dow!==0 && d.dow!==6 && !d.holiday);
  // TOPE FÍSICO de consultas de mañana: solo hay N despachos disponibles a la vez.
  // Cuenta TODAS las de mañana (AL, RHB, ALINTER, ALRU, ORT, RXINT). Al llenarse,
  // los facultativos que queden pasan a la tarde.
  const maxM = state.settings.maxMorning || 8;
  // RXINT no ocupa una de las consultas físicas (se hace en otro espacio), así que no cuenta.
  const OCUPA_CONSULTA = (code)=> !!code && code!=="RXINT";
  const mananasOcupadas = (dkey)=>{
    let n=0;
    state.physicians.forEach(p=>{ const a=getA(p.id,dkey); if(a && OCUPA_CONSULTA(a.m)) n++; });
    return n;
  };
  const hayHuecoMañana = (dkey)=> mananasOcupadas(dkey) < maxM;

  // ---- Una sola urgencia por semana y facultativo ----
  const esUrgencia = (a)=> !!a && (a.f==="URG" || a.f==="URGLV" || a.f==="URGF");
  // Urgencias que ya tiene en la semana ISO (lunes a DOMINGO) de esa fecha, aunque cruce de mes
  const urgEnSemana = (pid, dkey)=>{
    const monday = mondayOf(dkey); let n=0;
    for(let i=0;i<7;i++){
      const d = new Date(monday); d.setDate(monday.getDate()+i);
      const key = keyOf(d.getFullYear(), d.getMonth(), d.getDate());
      if(esUrgencia(state.assignments[pid+"|"+key])) n++;
    }
    return n;
  };
  // ¿Tiene urgencia el día anterior o el siguiente? Evita domingo+lunes seguidos,
  // que caen en semanas distintas y la regla semanal no detectaría.
  const urgDiaContiguo = (pid, dkey)=>{
    const pr = dkey.split("-").map(Number);
    const base = new Date(pr[0], pr[1]-1, pr[2]);
    for(const off of [-1, 1]){
      const d = new Date(base); d.setDate(base.getDate()+off);
      const key = keyOf(d.getFullYear(), d.getMonth(), d.getDate());
      if(esUrgencia(state.assignments[pid+"|"+key])) return true;
    }
    return false;
  };
  // El generador nunca pone dos urgencias en la misma semana ni en días seguidos.
  // (Tú sí puedes hacerlo a mano: las asignaciones manuales se respetan.)
  const puedeUrgencia = (p, dkey)=> urgEnSemana(p.id, dkey)===0 && !urgDiaContiguo(p.id, dkey);
  // Víspera de festivo: el día siguiente es festivo. Funciona como un viernes → cuenta como URGLV.
  const esPrefestivo = (dkey)=>{
    const pr = dkey.split("-").map(Number);
    const d = new Date(pr[0], pr[1]-1, pr[2]);
    d.setDate(d.getDate()+1);
    return hsetGlobal.has(keyOf(d.getFullYear(), d.getMonth(), d.getDate()));
  };
  const isoWeek = (k)=>{ const pr=k.split("-").map(Number); const dt=new Date(Date.UTC(pr[0],pr[1]-1,pr[2]));
    const day=(dt.getUTCDay()+6)%7; dt.setUTCDate(dt.getUTCDate()-day+3);
    const first=new Date(Date.UTC(dt.getUTCFullYear(),0,4)); const fday=(first.getUTCDay()+6)%7;
    first.setUTCDate(first.getUTCDate()-fday+3);
    return dt.getUTCFullYear()+"-W"+String(1+Math.round((dt-first)/(7*864e5))).padStart(2,"0"); };

  if(state.baseline && !isOfficial(ui.month)) delete state.baseline[baselineMonthKey(ui.month)];  // se rehará al final
  if(mode==="regen"){
    allDays.forEach(d=>{
      state.physicians.forEach(p=>{
        const k=p.id+"|"+d.key; const a=state.assignments[k];
        if(!a) return;
        if(a.f==="URG" || a.f==="URGLV" || a.f==="URGF" || (a.f==="L"&&a.auto) || !a.f){ delete state.assignments[k]; cleared++; }
      });
    });
  }

  const getA = (pid,date)=>state.assignments[pid+"|"+date];
  const freeM = (p,date)=>{ const a=getA(p.id,date); return !(a&&(a.f||a.m)); };   // mañana libre
  const freeT = (p,date)=>{ const a=getA(p.id,date); return !(a&&(a.f||a.t)); };   // tarde libre
  const notAbsent = (p,date)=>{ const a=getA(p.id,date); return !(a&&a.f); };
  const blockedOn = (p,d)=> (p.blocked||[]).includes(d.dow);
  // RHBT (rehabilitación de tarde): solo para quien tenga RHB1 o RHB2 como consulta habitual
  const esRHB = p=> p.pref==="RHB1" || p.pref==="RHB2";
  const puedeTarde = (p,c)=> c!=="RHBT" || esRHB(p);

  // ===== OBJETIVO de contrato = TODOS los días laborables del mes × % (los bloqueos NO reducen) =====
  const target = {}, baseTarget = {}, carry = {}, ausDias = {};
  state.physicians.forEach(p=>{
    // Días de ausencia (vacaciones, baja, permiso, libranza) en días laborables: no son exigibles
    let aus = 0;
    labDays.forEach(d=>{ const a=getA(p.id,d.key); if(a && a.f && ABSENCES[a.f]) aus++; });
    ausDias[p.id] = aus;
    baseTarget[p.id] = (labDays.length - aus) * (p.pct||100)/100;   // objetivo del mes, sin los días de ausencia
    carry[p.id] = carryBalance(p, ui.month, state.settings.computeFrom||0);  // saldo desde el mes de inicio del cómputo
    // Ajuste por saldo, SUAVE: como mucho se compensa un 25% del objetivo mensual.
    // Así un desfase grande se reparte entre varios meses en lugar de descargarse de golpe
    // (evita que alguien acabe con +7 turnos en un mes por compensar meses anteriores).
    const lim = baseTarget[p.id]*0.25;
    let ajuste = -carry[p.id];                       // saldo negativo => trabajar más
    ajuste = Math.max(-lim, Math.min(lim, ajuste));
    target[p.id] = Math.max(0, baseTarget[p.id] + ajuste);
  });

  // ===== Cargas iniciales =====
  const load={}, urgfLoad={}, urgLoad={}, urglvLoad={}, intLoad={};
  state.physicians.forEach(p=>{load[p.id]=0; urgfLoad[p.id]=0; urgLoad[p.id]=0; urglvLoad[p.id]=0; intLoad[p.id]=0;});
  // INTERVENCIONISMO combinado (RXINT + ALINTER) acumulado en el AÑO.
  // Objetivo: que la SUMA de ambas quede pareja para todos a lo largo de 2026.
  // Quien hace RXINT recibe menos ALINTER, de modo que el total de intervencionismo se iguala.
  const intvLoad = {}; state.physicians.forEach(p=>intvLoad[p.id]=0);
  {
    const yPref = state.year+"-";
    Object.entries(state.assignments).forEach(([k,a0])=>{ const i=k.indexOf("|"); const pid=k.slice(0,i), dk=k.slice(i+1);
      if(dk.indexOf(yPref)!==0 || intvLoad[pid]===undefined) return;
      const a = officialAt(pid, dk) || a0;
      if(a && (a.m==="ALINTER"||a.m==="RXINT")) intvLoad[pid]++; });
  }
  const monthPrefix = state.year+"-"+pad(ui.month+1);
  Object.entries(state.assignments).forEach(([k,a])=>{
    const idx=k.indexOf("|"); const pid=k.slice(0,idx), date=k.slice(idx+1);
    if(date.indexOf(monthPrefix)!==0 || load[pid]===undefined) return;
    load[pid]+=turnosOf(a);
    // (urgLoad/urglvLoad/urgfLoad se computan con acumulado ANUAL, más abajo)
  });
  // Reparto de urgencias equitativo a lo largo del AÑO: contamos las URG/URGLV/URGF
  // de todos los meses ya generados, no solo del mes actual. Así nadie se queda sin
  // URGLV por reiniciar el contador cada mes.
  {
    const yPref = state.year+"-";
    Object.entries(state.assignments).forEach(([k,a0])=>{
      const i=k.indexOf("|"); const pid=k.slice(0,i), dk=k.slice(i+1);
      if(dk.indexOf(yPref)!==0 || urgLoad[pid]===undefined) return;
      const a = officialAt(pid, dk) || a0;   // cómputo OFICIAL
      if(a.f==="URG") urgLoad[pid]++;
      else if(a.f==="URGLV") urglvLoad[pid]++;
      else if(a.f==="URGF") urgfLoad[pid]++;
    });
  }
  // ALRU acumulada en el AÑO (para reparto equitativo entre meses, no solo dentro del mes)
  const alruLoad = {}; state.physicians.forEach(p=>alruLoad[p.id]=0);
  {
    const yPref = state.year+"-";
    Object.entries(state.assignments).forEach(([k,a0])=>{
      const i=k.indexOf("|"); const pid=k.slice(0,i), dk=k.slice(i+1);
      if(dk.indexOf(yPref)!==0 || alruLoad[pid]===undefined) return;
      const a = officialAt(pid, dk) || a0;
      if(a && a.m==="ALRU") alruLoad[pid]++;
    });
  }

  const weight = p=>(p.pct||100)/100;
  const deficit = p=> target[p.id]-load[p.id];
  const wouldExceed = (p,add)=> (load[p.id]+add) > target[p.id] + 1e-9;
  const byDeficit = arr=> arr.slice().sort((x,y)=> (deficit(y)-deficit(x)) || (Math.random()-0.5));

  // ===== TOPE SEMANAL de turnos por facultativo =====
  // Máximo de turnos por semana = redondeo(5 × % contrato / 100). 100%→5, 80%→4, 25%→1.
  // Cuenta TODAS las consultas salvo fines de semana; URG y URGLV valen 2; URGF cuenta 0.
  const hsetGlobal = new Set(state.holidays.map(h=>h.date));
  // Devuelve el lunes (Date) de la semana que contiene dkey
  const mondayOf = (dkey)=>{
    const pr = dkey.split("-").map(Number);
    const base = new Date(pr[0], pr[1]-1, pr[2]);
    const dow = base.getDay();                            // 0=domingo..6=sábado
    const monday = new Date(base); monday.setDate(base.getDate() + (dow===0 ? -6 : 1-dow));
    return monday;
  };
  // Días laborables REALES (lun-vie que no sean festivo) de la semana que contiene dkey.
  // Cuenta la semana completa aunque cruce de mes. Máximo 5.
  const weekLaborables = (dkey)=>{
    const monday = mondayOf(dkey); let n=0;
    for(let i=0;i<5;i++){
      const d = new Date(monday); d.setDate(monday.getDate()+i);
      const key = keyOf(d.getFullYear(), d.getMonth(), d.getDate());
      if(!hsetGlobal.has(key)) n++;
    }
    return n;
  };
  // Turnos que un facultativo ya tiene en esa semana ISO completa (excluye findes y festivos)
  const weekTurnos = (pid, dkey)=>{
    const monday = mondayOf(dkey); let t=0;
    for(let i=0;i<5;i++){
      const d = new Date(monday); d.setDate(monday.getDate()+i);
      const key = keyOf(d.getFullYear(), d.getMonth(), d.getDate());
      if(hsetGlobal.has(key)) continue;                   // festivo no cuenta
      const a = state.assignments[pid+"|"+key];
      t += turnosOf(a);                                   // URG/URGLV=2, URGF=0, mañana/tarde=1
    }
    return t;
  };
  // Tope semanal DINÁMICO: (días laborables reales de esa semana, máx 5) × % contrato, redondeado.
  // Una semana con un festivo entre semana tiene un día laborable menos → un turno menos de tope.
  const weekCap = (pid, dkey)=>{
    const p = state.physicians.find(x=>x.id===pid);
    const lab = Math.min(5, weekLaborables(dkey));
    // Techo (no redondeo): un 25% con 5 laborables => 1,25 => tope 2. Así una semana puede llevar
    // 2 y otra 1, promediando su 25% real. Si se redondeara a 1 nunca alcanzaría su contrato mensual.
    // El límite efectivo lo pone el objetivo del mes (proporcional exacto al contrato).
    return Math.ceil(lab * ((p&&p.pct)||100)/100 - 1e-9);
  };
  // ¿Añadir 'add' turnos ese día dejaría al facultativo por encima de su tope semanal?
  const weekFull = (p, dkey, add)=> (weekTurnos(p.id, dkey) + add) > weekCap(p.id, dkey);
  // Selección para jornada ordinaria (add=1). Respeta el tope semanal SIEMPRE (duro) y el objetivo mensual.
  // dkey = día para el que se asigna (para comprobar la carga semanal).
  const pick = (cands, dkey)=>{
    if(!cands.length) return null;
    // El tope semanal es un límite duro: filtra primero
    let base = dkey ? cands.filter(p=>!weekFull(p, dkey, 1)) : cands;
    if(!base.length) return null;                         // nadie puede sin pasar su tope semanal → hueco
    const within = base.filter(p=>!wouldExceed(p,1));
    const poolC = within.length ? within : (strictMode ? [] : base);
    if(!poolC.length) return null;
    return byDeficit(poolC)[0];
  };
  // Selección por RONDAS para una consulta concreta (ALINTER/URG): equilibra su propio contador.
  // counter = objeto de conteo (intLoad/urgLoad). add = jornadas que suma (URG=2).
  const pickRound = (cands, counter, add, dkey)=>{
    if(!cands.length) return null;
    // Tope semanal duro
    let cc = dkey ? cands.filter(p=>!weekFull(p, dkey, add)) : cands;
    if(!cc.length) return null;
    let base = cc.filter(p=>!wouldExceed(p,add));
    if(!base.length) base = strictMode ? [] : cc;
    if(!base.length) return null;
    const minC = Math.min.apply(null, base.map(p=>counter[p.id]));
    const ronda = base.filter(p=>counter[p.id]===minC);
    return byDeficit(ronda)[0];
  };

  // =========================================================
  // FASE 1 · URGF (festivos/findes) por rondas equitativas. No cuenta como jornada.
  // =========================================================
  if(urgReq){
    const urgfDias = allDays.filter(d=>(d.dow===0||d.dow===6||d.holiday));
    // URGF que cada facultativo tiene YA en ESTE mes (incluidas las puestas a mano),
    // para que nadie repita dentro del mes salvo que no haya alternativa.
    const urgfMes = {}; state.physicians.forEach(p=>urgfMes[p.id]=0);
    urgfDias.forEach(d=>state.physicians.forEach(p=>{ const a=getA(p.id,d.key); if(a&&a.f==="URGF") urgfMes[p.id]++; }));

    urgfDias.forEach(d=>{
      const has = state.physicians.some(p=>{const a=getA(p.id,d.key); return a&&(a.f==="URG"||a.f==="URGF");});
      if(has) return;   // ya asignado (por el generador o a mano): se respeta
      const libres = state.physicians.filter(p=> !p.noUrgf && puedeUrgencia(p,d.key) && notAbsent(p,d.key) && freeM(p,d.key) && freeT(p,d.key));
      if(!libres.length){ missing_push(unfilled,d.key,"URGF"); return; }
      // Preferencia ABSOLUTA por quien aún no tiene ninguna URGF este mes.
      // Solo si no queda nadie sin URGF se permite repetir (más festivos que adjuntos disponibles).
      const sinRepetir = libres.filter(p=>urgfMes[p.id]===0);
      const cand = sinRepetir.length ? sinRepetir : libres;
      const minR = Math.min.apply(null, cand.map(p=>urgfLoad[p.id]));   // equilibrio a lo largo del año
      const ronda = cand.filter(p=>urgfLoad[p.id]===minR);
      ronda.sort((x,y)=> (urgfMes[x.id]-urgfMes[y.id]) || (load[x.id]/weight(x)-load[y.id]/weight(y)) || (Math.random()-0.5));
      const p=ronda[0];
      state.assignments[p.id+"|"+d.key]={f:"URGF"}; urgfLoad[p.id]++; urgfMes[p.id]++; assigned++;
    });
  }

  // =========================================================
  // FASE 2 · Urgencias en días laborables, SEPARADAS por tipo de día:
  //   · URGLV = lunes (dow 1) y viernes (dow 5)  → reparto equitativo propio (urglvLoad)
  //   · URG   = martes, miércoles, jueves (2,3,4) → reparto equitativo propio (urgLoad)
  // Ambas computan 2 jornadas y no generan libranza. Quien no trabaja los viernes
  // acumulará más lunes de forma natural (el viernes queda bloqueado para él).
  // =========================================================
  if(urgReq){
    labDays.forEach(d=>{
      const has = state.physicians.some(p=>{const a=getA(p.id,d.key); return a&&(a.f==="URG"||a.f==="URGLV"||a.f==="URGF");});
      if(has) return;
      // URGLV: lunes, viernes y vísperas de festivo (p. ej. el jueves 24 si el viernes 25 es festivo)
      const esLV = (d.dow===1 || d.dow===5 || esPrefestivo(d.key));
      const cand = state.physicians.filter(p=>
        !p.noUrg && puedeUrgencia(p,d.key) && !blockedOn(p,d) && notAbsent(p,d.key) && freeM(p,d.key) && freeT(p,d.key)
      );
      const counter = esLV ? urglvLoad : urgLoad;
      const code = esLV ? "URGLV" : "URG";
      const p = pickRound(cand, counter, 2, d.key);
      if(p){ state.assignments[p.id+"|"+d.key]={f:code}; load[p.id]+=2; counter[p.id]++; assigned++; }
      else if(!cand.length) missing_push(unfilled,d.key,code);
      else missing_push(unfilled,d.key,code+" (cupos completos)");
    });
  }

  // =========================================================
  // FASE 2b · RXINT: consulta de mañana los JUEVES (dow 4). Debe cubrirse siempre.
  // Solo la hacen quienes NO tengan "RXINT: No". Reparto equitativo por rondas.
  // =========================================================
  // RXINT (jueves): se cubre siempre, eligiendo entre quienes la hacen a quien MENOS
  // intervencionismo total (RXINT+ALINTER) lleva en el año → así la suma se equilibra.
  {
    labDays.filter(d=>d.dow===4).forEach(d=>{
      const ya = state.physicians.some(p=>{const a=getA(p.id,d.key); return a&&a.m==="RXINT";});
      if(ya) return;
      const cand = state.physicians.filter(p=> !p.noRxint && !blockedOn(p,d) && freeM(p,d.key));
      const p = pickRound(cand, intvLoad, 1, d.key);
      if(p){ state.assignments[p.id+"|"+d.key]=Object.assign({},getA(p.id,d.key)||{},{m:"RXINT"}); load[p.id]++; intvLoad[p.id]++; assigned++; }
      else missing_push(unfilled,d.key,"RXINT");
    });
  }

  // =========================================================
  // FASE 3 · ALINTER (una al día) por rondas equitativas entre quienes la hacen
  // =========================================================
  if(state.settings.alinterDaily!==false){
    labDays.forEach(d=>{
      const ya = state.physicians.some(p=>{const a=getA(p.id,d.key); return a&&a.m==="ALINTER";});
      if(ya) return;
      if(!hayHuecoMañana(d.key)){ missing_push(unfilled,d.key,"ALINTER (sin consulta libre)"); return; }
      const cand = state.physicians.filter(p=> !p.noInt && !blockedOn(p,d) && freeM(p,d.key));
      // ALINTER: al de MENOS intervencionismo total (RXINT+ALINTER) en el año.
      // Quien ya acumuló RXINT recibirá menos ALINTER, igualando la suma para todos.
      const p = pickRound(cand, intvLoad, 1, d.key);
      if(p){ state.assignments[p.id+"|"+d.key]=Object.assign({},getA(p.id,d.key)||{},{m:"ALINTER"}); load[p.id]++; intvLoad[p.id]++; assigned++; }
      else missing_push(unfilled,d.key,"ALINTER");
    });
  }

  // =========================================================
  // FASE 3b · ORT: N consultas al mes (por defecto 1), como consulta de mañana,
  // repartidas entre quienes la hacen (menor carga de ORT primero) y en días distintos.
  // =========================================================
  {
    const ortTarget = (state.settings.ortMonthly!==undefined ? state.settings.ortMonthly : 1);
    if(ortTarget > 0){
      // Reparto equitativo ANUAL: contamos cuántas ORT lleva cada uno en TODO el año,
      // para que de octubre a diciembre roten y no recaiga siempre en el mismo.
      const ortYear={}; state.physicians.forEach(p=>ortYear[p.id]=0);
      const yPref = state.year+"-";
      Object.entries(state.assignments).forEach(([k,a0])=>{ const i=k.indexOf("|"); const pid=k.slice(0,i), dk=k.slice(i+1);
        if(dk.indexOf(yPref)!==0 || ortYear[pid]===undefined) return;
        const a = officialAt(pid, dk) || a0;
        if(a && a.m==="ORT") ortYear[pid]++; });
      // ORT ya colocadas ESTE mes
      let have = 0;
      labDays.forEach(d=>state.physicians.forEach(p=>{ const a=getA(p.id,d.key); if(a&&a.m==="ORT") have++; }));
      let guard=0;
      while(have<ortTarget && guard++<40){
        // candidato global: el que MENOS ORT lleva en el año (desempate aleatorio), que la pueda hacer
        const elegibles = state.physicians.filter(p=>!p.noOrt);
        if(!elegibles.length) break;
        const minY = Math.min.apply(null, elegibles.map(p=>ortYear[p.id]));
        const conMenos = elegibles.filter(p=>ortYear[p.id]===minY).sort(()=>Math.random()-0.5);
        let colocada=false;
        for(const p of conMenos){
          // buscar un día laborable con su mañana libre y sin ORT ese día
          const dias = labDays.slice().sort(()=>Math.random()-0.5);   // aleatorio para variar el día
          for(const d of dias){
            if(blockedOn(p,d)) continue;
            if(!hayHuecoMañana(d.key)) continue;
            const a=getA(p.id,d.key); if(a&&(a.f||a.m)) continue;
            if(strictMode && wouldExceed(p,1)) continue;
            if(weekFull(p,d.key,1)) continue;
            if(state.physicians.some(q=>{const aa=getA(q.id,d.key); return aa&&aa.m==="ORT";})) continue;
            state.assignments[p.id+"|"+d.key]=Object.assign({},getA(p.id,d.key)||{},{m:"ORT"});
            load[p.id]++; ortYear[p.id]++; assigned++; have++; colocada=true; break;
          }
          if(colocada) break;
        }
        if(!colocada) break;
      }
      if(have<ortTarget) missing_push(unfilled, labDays.length?labDays[0].key:(monthPrefix+"-01"), "ORT mes: "+have+"/"+ortTarget);
    }
  }

  // =========================================================
  // FASE 3c · ALRU: objetivo por semana natural, ANTES que las consultas AL normales.
  // Se coloca aquí (tras urgencias/intervencionismo/ORT) para que tenga sitio dentro de los topes.
  // =========================================================
  if(alruTarget > 0){
    const weeks = {};
    labDays.forEach(d=>{ (weeks[isoWeek(d.key)] = weeks[isoWeek(d.key)]||[]).push(d); });
    // Contador de ALRU por semana y adjunto (para el tope de 1/semana), sembrado con lo ya asignado
    const alruWk = {};   // pid -> {wk -> n}
    state.physicians.forEach(p=>{ alruWk[p.id]={}; });
    labDays.forEach(d=>state.physicians.forEach(p=>{ const a=getA(p.id,d.key);
      if(a&&a.m==="ALRU"){ const w=isoWeek(d.key); alruWk[p.id][w]=(alruWk[p.id][w]||0)+1; } }));
    const alruInWeek = (pid,wk)=> (alruWk[pid][wk]||0);

    Object.keys(weeks).forEach(wk=>{
      const wdays = weeks[wk];
      let have=0;
      wdays.forEach(d=>state.physicians.forEach(p=>{ const a=getA(p.id,d.key); if(a&&a.m==="ALRU") have++; }));

      while(have<alruTarget){
        // De TODOS los (día,persona) válidos esta semana, elegir la persona con MENOS ALRU en el año.
        // Prioridad absoluta a alruLoad; desempate por menor carga total y azar. Recorremos primero
        // por persona (elegimos quién) y luego le buscamos un día libre.
        const elegibles = state.physicians.filter(p=>{
          if(p.noAlru) return false;
          if(alruInWeek(p.id,wk)>=1) return false;      // ya tiene ALRU esta semana
          // ¿tiene algún día válido esta semana?
          return wdays.some(d=>{
            if(blockedOn(p,d)) return false;
            if(!hayHuecoMañana(d.key)) return false;
            const a=getA(p.id,d.key); if(a&&(a.f||a.m)) return false;
            if(state.physicians.some(q=>{const aa=getA(q.id,d.key); return aa&&aa.m==="ALRU";})) return false;
            if(strictMode && wouldExceed(p,1)) return false;
            if(weekFull(p,d.key,1)) return false;
            return true;
          });
        });
        if(!elegibles.length) break;
        // ordenar por ALRU anual (asc), luego carga total (asc), luego azar
        elegibles.sort((x,y)=> (alruLoad[x.id]-alruLoad[y.id]) || (load[x.id]-load[y.id]) || (Math.random()-0.5));
        const p = elegibles[0];
        // buscar su primer día válido de la semana
        const d = wdays.find(dd=>{
          if(blockedOn(p,dd)) return false;
          if(!hayHuecoMañana(dd.key)) return false;
          const a=getA(p.id,dd.key); if(a&&(a.f||a.m)) return false;
          if(state.physicians.some(q=>{const aa=getA(q.id,dd.key); return aa&&aa.m==="ALRU";})) return false;
          if(strictMode && wouldExceed(p,1)) return false;
          if(weekFull(p,dd.key,1)) return false;
          return true;
        });
        if(!d) break;
        state.assignments[p.id+"|"+d.key]=Object.assign({},getA(p.id,d.key)||{},{m:"ALRU"});
        load[p.id]++; assigned++; have++;
        alruLoad[p.id]++; alruWk[p.id][wk]=(alruWk[p.id][wk]||0)+1;
      }
      if(have<alruTarget) missing_push(unfilled, wdays[0].key, "ALRU semana: "+have+"/"+alruTarget);
    });
  }

  // =========================================================
  // FASE 4 · Resto de mañanas del pool hasta el mínimo (mayor déficit)
  // =========================================================
  labDays.forEach(d=>{
    const cmapDay={};
    state.physicians.forEach(p=>{const a=getA(p.id,d.key); if(a&&a.m) cmapDay[a.m]=true;});
    let covered = pool.filter(c=>cmapDay[c]).length;
    const canDo = (pp,c)=> !((c==="RHB1"||c==="RHB2") && pp.noRhb) && !(c==="ALRU" && pp.noAlru);
    // 1ª pasada: consulta habitual
    pool.forEach(c=>{
      if(c==="ALINTER") return; // ya gestionado en fase 3
      if(covered>=minM || cmapDay[c]) return;
      if(!hayHuecoMañana(d.key)) return;   // no quedan consultas físicas libres
      const cand = state.physicians.filter(pp=>pp.pref===c && canDo(pp,c) && !blockedOn(pp,d) && notAbsent(pp,d.key) && freeM(pp,d.key) && !wouldExceed(pp,1) && !weekFull(pp,d.key,1));
      if(cand.length){ const p=byDeficit(cand)[0]; state.assignments[p.id+"|"+d.key]=Object.assign({},getA(p.id,d.key)||{},{m:c}); load[p.id]++; assigned++; cmapDay[c]=true; covered++; }
    });
    // 2ª pasada: mayor déficit
    pool.forEach(c=>{
      if(c==="ALINTER") return;
      if(covered>=minM || cmapDay[c]) return;
      if(!hayHuecoMañana(d.key)) return;   // no quedan consultas físicas libres
      const cand = state.physicians.filter(pp=>canDo(pp,c) && !blockedOn(pp,d) && notAbsent(pp,d.key) && freeM(pp,d.key));
      const p = pick(cand, d.key);
      if(p){ state.assignments[p.id+"|"+d.key]=Object.assign({},getA(p.id,d.key)||{},{m:c}); load[p.id]++; assigned++; cmapDay[c]=true; covered++; }
    });
    if(covered<minM){ missing_push(unfilled,d.key,"Mañanas: faltan "+(minM-covered)); }
  });

  // =========================================================
  // =========================================================
  // FASE 5 · Tardes: máximo UNA por semana y adjunto (de cualquier tipo ALT1/ALT2/ALT3).
  // Las tardes NO son obligatorias cada día: se cubren tantas como sea posible sin que
  // nadie pase de 1 tarde/semana. Los huecos sobrantes quedan vacíos (algún día tendrá
  // 3 tardes, otro 2 o 1). Se reparten equitativamente a lo largo del mes.
  // =========================================================
  {
    const tardeSemana = {};   // pid -> { semanaISO -> nº tardes }
    const tardeTotal = {};    // pid -> nº total de tardes en el mes
    state.physicians.forEach(p=>{ tardeSemana[p.id]={}; tardeTotal[p.id]=0; });
    // Contar tardes ya asignadas a mano
    labDays.forEach(d=>{ state.physicians.forEach(p=>{ const a=getA(p.id,d.key);
      if(a && a.t){ const wk=isoWeek(d.key); tardeSemana[p.id][wk]=(tardeSemana[p.id][wk]||0)+1; tardeTotal[p.id]++; } }); });
    const yaTieneTardeEsaSemana = (pid,wk)=> (tardeSemana[pid][wk]||0) > 0;

    const tardeDays = labDays.filter(d=>d.dow!==5);   // sin viernes
    // Recorremos día a día y, en cada día, cada consulta de tarde requerida.
    // Orden de asignación: primero las consultas de tarde con MENOS facultativos elegibles.
    // RHBT solo la hacen los de RHB habitual, así que va antes que ALT1/ALT2/ALT3; si no,
    // esos facultativos ya tendrían ocupada su tarde de la semana cuando le tocara a RHBT.
    const elegiblesPara = (c)=> state.physicians.filter(pp=>puedeTarde(pp,c)).length;
    const reqTOrden = reqT.slice().sort((x,y)=> elegiblesPara(x)-elegiblesPara(y));

    tardeDays.forEach(d=>{
      const wk = isoWeek(d.key);
      reqTOrden.forEach(c=>{
        const taken = state.physicians.some(p=>{const a=getA(p.id,d.key); return a&&a.t===c;});
        if(taken) return;
        // Candidatos: libres esa tarde, no bloqueados, no ausentes, SIN tarde aún esa semana.
        let cand = state.physicians.filter(pp=>
          puedeTarde(pp,c) && !blockedOn(pp,d) && notAbsent(pp,d.key) && freeT(pp,d.key) && !yaTieneTardeEsaSemana(pp.id,wk) && !weekFull(pp,d.key,1)
        );
        // Preferimos a quien no se pase de su objetivo de contrato.
        const within = cand.filter(pp=>!wouldExceed(pp,1));
        if(within.length) cand = within;
        else if(strictMode) return;   // en modo estricto: antes hueco que pasarse del contrato
        // Si NADIE puede, la tarde se queda sin cubrir (las tardes son opcionales).
        if(!cand.length) return;
        // Entre válidos: menos tardes en el mes, luego mayor déficit de jornadas, luego azar.
        cand.sort((x,y)=>{
          // Consulta habitual primero (p. ej. RHBT para quien tiene RHB1/RHB2)
          const px = (x.pref===c || (c==="RHBT" && esRHB(x))) ? 0 : 1;
          const py = (y.pref===c || (c==="RHBT" && esRHB(y))) ? 0 : 1;
          if(px!==py) return px-py;
          if(tardeTotal[x.id]!==tardeTotal[y.id]) return tardeTotal[x.id]-tardeTotal[y.id];
          const dd = deficit(y)-deficit(x);
          if(Math.abs(dd)>1e-9) return dd;
          return Math.random()-0.5;
        });
        const p = cand[0];
        state.assignments[p.id+"|"+d.key]=Object.assign({},getA(p.id,d.key)||{},{t:c});
        load[p.id]++; assigned++;
        tardeSemana[p.id][wk]=(tardeSemana[p.id][wk]||0)+1; tardeTotal[p.id]++;
      });
    });
  }

  // =========================================================
  // FASE 7 · COMPLETAR CONTRATO con dobles turnos (mañana AL5 + tarde AT1, etc.)
  // Para quien aún no llega a su objetivo, se rellenan huecos de mañana y/o tarde
  // en días laborables (respetando bloqueos y ausencias), incluso doblando el mismo día.
  // =========================================================
  {
    // Catálogos de relleno: TODAS las consultas de mañana y de tarde (excepto ALINTER, ya gestionada)
    const allM = MORNING.map(c=>c.code).filter(c=>c!=="ALINTER");
    const allT = AFTERNOON.map(c=>c.code);
    // Al completar contrato, quien es de RHB recibe antes RHBT que una ALT genérica
    const allTFor = (p)=> allT.filter(c=>puedeTarde(p,c)).sort((a,b)=>{
      if(!esRHB(p)) return 0;
      return (a==="RHBT"?0:1)-(b==="RHBT"?0:1);
    });
    const freeCode = (list, dkey)=>{
      const usados = {};
      state.physicians.forEach(q=>{ const a=getA(q.id,dkey); if(a){ if(a.m)usados[a.m]=1; if(a.t)usados[a.t]=1; } });
      return list.find(c=>!usados[c]) || list[0];
    };
    // Nº de tardes que tiene un adjunto en la semana de una fecha (para respetar el tope de 1/semana)
    const tardesSemanaDe = (pid, dkey)=>{
      const wk = isoWeek(dkey); let n=0;
      labDays.forEach(dd=>{ if(isoWeek(dd.key)===wk){ const a=getA(pid,dd.key); if(a&&a.t) n++; } });
      return n;
    };
    let progress=true, safety=0;
    while(progress && safety++<3000){
      progress=false;
      // Se completa hasta el turno MÁS PRÓXIMO: si falta 0,5 o más de jornada, se añade un turno.
      // Con jornadas fraccionadas (80% de 21 días = 16,8) es imposible cuadrar exacto; redondeando
      // así la desviación nunca pasa de medio turno, en vez de acumular -0,8 cada mes.
      const needing = state.physicians.filter(p=> deficit(p) >= 0.5-1e-9).sort((x,y)=>deficit(y)-deficit(x));
      for(const p of needing){
        let done=false;
        // 1ª vuelta: intentar SOLO mañanas (no añade tardes)
        for(const d of labDays){
          if(blockedOn(p,d)) continue;
          const a=getA(p.id,d.key);
          if(a&&a.f) continue;
          if(freeM(p,d.key) && !weekFull(p,d.key,1) && hayHuecoMañana(d.key)){
            const c = freeCode(allM, d.key);
            state.assignments[p.id+"|"+d.key]=Object.assign({},getA(p.id,d.key)||{},{m:c});
            load[p.id]++; assigned++; progress=true; done=true; break;
          }
        }
        if(done) break;
        // 2ª vuelta: tardes, respetando el tope de 1 tarde por semana
        for(const d of labDays){
          if(d.dow===5) continue;                    // nunca viernes
          if(blockedOn(p,d)) continue;
          const a=getA(p.id,d.key);
          if(a&&a.f) continue;
          if(freeT(p,d.key) && tardesSemanaDe(p.id,d.key)===0 && !weekFull(p,d.key,1)){
            const c = freeCode(allTFor(p), d.key);
            state.assignments[p.id+"|"+d.key]=Object.assign({},getA(p.id,d.key)||{},{t:c});
            load[p.id]++; assigned++; progress=true; done=true; break;
          }
        }
        if(done) break;
        // 3ª vuelta (ÚLTIMO RECURSO): una SEGUNDA tarde en la misma semana, solo cuando
        // sin ella el facultativo no llegaría a su contrato. Sigue respetando el tope
        // semanal de turnos, sus días de no trabajo y la norma de no poner tardes en viernes.
        for(const d of labDays){
          if(d.dow===5) continue;
          if(blockedOn(p,d)) continue;
          const a2=getA(p.id,d.key);
          if(a2&&a2.f) continue;
          if(freeT(p,d.key) && !weekFull(p,d.key,1)){
            const c = freeCode(allTFor(p), d.key);
            state.assignments[p.id+"|"+d.key]=Object.assign({},getA(p.id,d.key)||{},{t:c});
            load[p.id]++; assigned++; progress=true; done=true; break;
          }
        }
        if(done) break;
      }
    }
  }

  snapshotBaseline(ui.month);   // foto del cuadrante OFICIAL de este mes
  save();
  return {assigned, cleared, unfilled};
}

function missing_push(arr, date, code){
  const e = arr.find(x=>x.date===date);
  if(e){ e.codes.push(code); } else arr.push({date:date, codes:[code]});
}

function resetMonth(all){
  const prefix = state.year+"-"+pad(ui.month+1);
  let n=0;
  Object.keys(state.assignments).forEach(k=>{
    const date = k.slice(k.indexOf("|")+1);
    if(date.indexOf(prefix)!==0) return;
    const a = state.assignments[k];
    if(all || a.f==="URG" || a.f==="URGLV" || a.f==="URGF" || (a.f==="L"&&a.auto) || !a.f){ delete state.assignments[k]; n++; }
  });
  save(); return n;
}

document.addEventListener("change", e=>{
  const el = e.target;
  const fld = el.dataset ? (el.dataset.field||"") : "";
  if(fld.indexOf("rq-")===0){
    const nt = document.getElementById("rq-note"); if(nt) ui.reqNote = nt.value;
    const rqRefresh = ()=>{ (ui.reqModal && ui.reqModal.tab) ? render() : renderModal(); };
    if(fld==="rq-phys"){ if(ui.reqModal){ ui.reqModal.pid = el.value; if(ui.reqDraft){ ui.reqDraft.fromPart = undefined; ui.reqDraft.movePart = undefined; } rqRefresh(); } }
    else if(fld==="rq-date"){ if(ui.reqModal && el.value){ ui.reqModal.date = el.value; if(ui.reqDraft){ ui.reqDraft.fromPart = undefined; ui.reqDraft.movePart = undefined; } rqRefresh(); } }
    else if(fld==="rq-f"){ ui.reqDraft = ui.reqDraft||{}; ui.reqDraft.f = el.value; if(el.value){ ui.reqDraft.m=""; ui.reqDraft.t=""; } rqRefresh(); }
    else if(fld==="rq-m"){ ui.reqDraft = ui.reqDraft||{}; ui.reqDraft.m = el.value; ui.reqDraft.f=""; rqRefresh(); }
    else if(fld==="rq-t"){ ui.reqDraft = ui.reqDraft||{}; ui.reqDraft.t = el.value; ui.reqDraft.f=""; rqRefresh(); }
    else if(fld==="rq-type"){ if(ui.reqModal){ ui.reqModal.type = el.value; rqRefresh(); } }
    else if(fld==="rq-movepart"){ ui.reqDraft = ui.reqDraft||{}; ui.reqDraft.movePart = el.value; ui.reqDraft.moveSlot = el.value ? el.value.split(":")[0] : "m"; rqRefresh(); }
    else if(fld==="rq-moveslot"){ ui.reqDraft = ui.reqDraft||{}; ui.reqDraft.moveSlot = el.value; rqRefresh(); }
    else if(fld==="rq-physb"){ if(ui.reqModal){ ui.reqModal.pidB = el.value; rqRefresh(); } }
    else if(fld==="rq-dateb"){ if(ui.reqModal && el.value){ ui.reqModal.dateB = el.value; rqRefresh(); } }
    else if(fld==="rq-name"){ ui.reqName = el.value; try{ localStorage.setItem(KEY_REQNAME, el.value.trim()); }catch(e2){} }
    return;
  }
  // Los campos que solo afectan a la VISTA (rango de meses de Estadísticas) funcionan
  // también en modo consulta: no modifican el cuadrante ni se guardan.
  const fieldVista = el.dataset ? (el.dataset.field||"") : "";
  if(fieldVista==="stats-from"){ ui.statsFrom = Number(el.value); saveStatsView(); render(); return; }
  if(fieldVista==="stats-to"){ ui.statsTo = Number(el.value); saveStatsView(); render(); return; }
  if(MODE==="viewer") return;
  const field = el.dataset.field;
  if(el.id==="import-file"){ if(el.files&&el.files[0]) importBackup(el.files[0]); el.value=""; return; }
  if(!field) return;
  if(field==="phys-name"){ const p=state.physicians.find(x=>x.id===el.dataset.pid); if(p){p.name=el.value.trim()||p.name; save(); render();} }
  else if(field==="phys-pct"){ const p=state.physicians.find(x=>x.id===el.dataset.pid); if(p){p.pct=Math.min(100,Math.max(10,Number(el.value)||100)); save(); render();} }
  else if(field==="phys-pref"){ const p=state.physicians.find(x=>x.id===el.dataset.pid); if(p){p.pref=el.value||null; save();} }
  else if(field==="autolib"){ state.settings.autoLibranza = el.checked; save(); }
  else if(field==="urgreq"){ state.settings.urgRequired = el.checked; save(); }
  else if(field==="minmorning"){ state.settings.minMorning = Math.min(20,Math.max(0,Number(el.value)||0)); save(); }
  else if(field==="maxmorning"){ state.settings.maxMorning = Math.min(20,Math.max(1,Number(el.value)||8)); save(); }
  else if(field==="rot-name"){
    state.rotantesLeyenda = state.rotantesLeyenda || {R1:"",R2:"",R3:"",R4:"",R5:""};
    state.rotantesLeyenda[el.dataset.rot] = el.value.trim();
    save();   // no redibuja: se puede seguir escribiendo o pasar al siguiente campo
  }
  else if(field==="alruweek"){ state.settings.alruPerWeek = Math.min(10,Math.max(0,Number(el.value)||0)); save(); }
  else if(field==="alinterdaily"){ state.settings.alinterDaily = el.checked; save(); }
  else if(field==="strictquota"){ state.settings.strictQuota = el.checked; save(); }
  else if(field==="computefrom"){ state.settings.computeFrom = Number(el.value)||0; save(); }
  else if(field==="ortmonthly"){ state.settings.ortMonthly = Math.min(10,Math.max(0,Number(el.value)||0)); save(); }
  else if(field==="stats-from"){ ui.statsFrom = Number(el.value); render(); }
  else if(field==="stats-to"){ ui.statsTo = Number(el.value); render(); }
  else if(field==="req-email"){ state.settings.reqEmail = el.value.trim(); save(); }
  else if(field==="req-phone"){ state.settings.reqPhone = el.value.replace(/[^0-9+ ]/g,"").trim(); save(); }
});

document.addEventListener("keydown", e=>{
  if(e.key==="Escape"&&(ui.editCell||ui.dayDetail||ui.genModal||ui.resetMonthModal||ui.reqModal||ui.reviewModal)){ ui.editCell=null; ui.dayDetail=null; ui.genModal=false; ui.genReport=null; ui.resetMonthModal=false; ui.reqModal=null; ui.reviewModal=null; renderModal(); }
});

// ------------------ Inicio ------------------
function applyPublished(d){
  state.physicians = (d.physicians||[]).map(p=>{const q=Object.assign({blocked:[]},p); if(q.noUrgf===undefined) q.noUrgf=!!q.noUrg; return q;});
  state.assignments = d.assignments||{};
  state.baseline = d.baseline||{};
  state.official = d.official||{};
  state.rotantes = d.rotantes||{};
  state.rotantesLeyenda = Object.assign({R1:"",R2:"",R3:"",R4:"",R5:""}, d.rotantesLeyenda||{});
  if(d.adminPass) state.adminPass = d.adminPass;   // la contraseña llega con la publicación
  state.holidays = d.holidays||DEFAULT_HOLIDAYS.slice();
  state.settings = Object.assign(DEFAULT_SETTINGS(), d.settings||{});
  state.settings.required = Object.assign({}, DEFAULT_REQUIRED, (d.settings&&d.settings.required)||{});
  state.year = d.year||2026;
  PUBLISHED_AT = d.publishedAt||null;
}
// ---- Actualización automática de la versión publicada ----
// El equipo no tiene que pulsar nada: la app comprueba si hay una publicación más reciente
// al volver a primer plano y cada minuto mientras esté abierta.
let AUTO_T = null;
function ocupadoEditando(){
  // No interrumpir si hay un formulario o una ventana abierta encima
  if(ui.tab === "solicitudes") return true;
  try{ if(document.querySelector(".overlay")) return true; }catch(e){}
  return false;
}
async function autoRefresh(){
  try{
    const d = await fetchPublished();
    if(!d || !d.publishedAt) return;
    if(PUBLISHED_AT && d.publishedAt <= PUBLISHED_AT) return;   // nada nuevo
    if(MODE === "viewer"){
      if(ocupadoEditando()) return;            // se aplicará en la siguiente comprobación
      applyPublished(d);
      render();
      setSave("✓ Actualizado");
    }else{
      // En un dispositivo de edición no se sobrescribe nada: solo se avisa
      if(d.publishedBy && d.publishedBy===DEVICE_ID){ PUBLISHED_AT = d.publishedAt; return; }   // publicado por este mismo dispositivo
      if(!state.updatedAt || d.publishedAt > state.updatedAt){ NEWER = true; PUBLISHED_AT = d.publishedAt; render(); }
    }
  }catch(e){ /* sin conexión: se reintenta más adelante */ }
}
function startAutoRefresh(){
  if(AUTO_T) clearInterval(AUTO_T);
  AUTO_T = setInterval(()=>{ if(document.visibilityState === "visible") autoRefresh(); }, 60000);
  document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState === "visible") autoRefresh(); });
  window.addEventListener("focus", autoRefresh);
  window.addEventListener("online", autoRefresh);
}

async function boot(){
  loadState();
  let published=null, hasLocal=false;
  try{ hasLocal = !!localStorage.getItem(KEY); }catch(e){}
  try{
    published = await fetchPublished();
  }catch(e){ /* sin publicación o sin conexión */ }
  // Un dispositivo sin datos propios (o en ventana privada) SIEMPRE empieza en modo consulta,
  // aunque no se haya podido descargar la publicación.
  if(!hasLocal) MODE = "viewer";
  // Adoptar la contraseña publicada aunque este dispositivo tenga datos antiguos sin ella
  if(published && published.adminPass && !state.adminPass) state.adminPass = published.adminPass;
  if(published && !hasLocal){ MODE="viewer"; applyPublished(published); }
  else if(published && hasLocal && published.publishedAt &&
          !(published.publishedBy && published.publishedBy===DEVICE_ID) &&
          (!state.updatedAt || published.publishedAt > state.updatedAt)){
    NEWER = true; PUBLISHED_AT = published.publishedAt;
  }else if(published && published.publishedAt){ PUBLISHED_AT = published.publishedAt; }
  // Si hay contraseña configurada, no se entra en edición sin haberla introducido en esta sesión
  if(adminPassHash() && !estaAutenticado()) MODE = "viewer";
  loadStatsView();
  setSave(MODE==="viewer" ? "Solo consulta" : "✓ Guardado");
  render();
  startAutoRefresh();
}
boot();
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
</script>
